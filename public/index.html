<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知档</title><link rel="stylesheet" href="/style.css"></head><body><main><section class="panel"><div class="step" id="step-main"><div class="step-head"><h2 id="step-title">登录知乎导出</h2><button type="button" id="auth-btn">开始登录</button></div><p class="hint" id="auth-status"><span id="auth-status-text">本应用不会保存或上传用户名和密码</span><button type="button" class="link-inline" id="quota-help-btn" hidden aria-label="什么是创作能力额度？">额度说明</button></p><div class="dir-row" id="secret-row" hidden title="在 developer.zhihu.com 个人中心生成 Access Secret 后粘贴于此，仅保存在本机系统钥匙串。"><label for="secret-input" class="dir-label">Access Secret</label><input id="secret-input" type="password" placeholder="粘贴 Access Secret"><button type="button" class="link-inline" id="secret-help-link">去获取</button></div><div class="dir-row" id="profile-row" hidden title="可选。官方接口不返回用户名，贴一次主页地址可以用来命名文件夹和显示欢迎语，只在本机保存，不会验证也不会上传。"><label for="profile-input" class="dir-label">知乎主页地址</label><input id="profile-input" type="text" placeholder="https://www.zhihu.com/people/xxx（可选）"></div><div class="dir-row" id="save-location-row" hidden title="只写入不存在或为空的目录，不会覆盖已有内容。"><label for="dir" class="dir-label">保存位置</label><input id="dir" value="exports"><button type="button" class="secondary" id="browse">浏览…</button></div><div class="actions" id="download-actions" hidden><label class="check"><input id="images" type="checkbox" checked> 下载正文图片</label><button id="export">开始导出</button></div></div></section><section class="status" id="status-section" hidden><span id="dot" class="idle"></span><div><strong id="message">准备就绪</strong><progress id="bar" value="0" max="100"></progress><small id="count"></small></div><button type="button" class="secondary" id="pause-btn" hidden>暂停</button></section><div class="task-list" id="task-list" hidden></div><footer>所有内容和登录会话仅保存在这台电脑，不会上传到任何地方。<button type="button" id="about-btn" class="link-hint">关于</button></footer></main><div id="about-overlay" class="overlay" hidden><div class="about-card"><button type="button" id="about-close" class="close-btn" aria-label="关闭">×</button><div class="mark-sm">档</div><h2>知档</h2><p id="about-edition-desc"></p><dl class="about-info"><dt>版本号</dt><dd id="about-version">—</dd><dt>版本类型</dt><dd id="about-edition">—</dd><dt>作者</dt><dd>张英锋</dd><dt>网站</dt><dd><button type="button" class="link-inline" id="about-website">yingfeng.ca/zhi-dang</button></dd><dt>协议</dt><dd>MIT 开源协议</dd><dt>源码</dt><dd><button type="button" class="link-inline" id="about-repo">GitHub</button></dd></dl></div></div><div id="quota-overlay" class="overlay" hidden><div class="about-card"><button type="button" id="quota-close" class="close-btn" aria-label="关闭">×</button><h2>什么是创作能力额度？</h2><p>"创作能力"额度，默认每个租户每个自然日共计 100 次，未实名等低额度用户为 10 次；与"本人全文""评论""账号统计""单篇统计"等接口共用同一份额度，实际额度以知乎的额度查询接口为准。</p><dl class="about-info"><dt>官方说明</dt><dd><button type="button" class="link-inline" id="quota-docs-link">开放平台文档</button></dd><dt>实际用量</dt><dd><button type="button" class="link-inline" id="quota-profile-link">开放平台个人中心</button></dd></dl></div></div><div id="toast" class="toast" hidden></div><script src="/app.js"></script></body></html>
