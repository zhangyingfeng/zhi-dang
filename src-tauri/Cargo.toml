[package]
name = "app"
version = "1.1.1"
description = "知档桌面客户端"
authors = ["zhangyingfeng"]
license = "MIT"
repository = "https://github.com/zhangyingfeng/zhi-dang"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
default = []
# The direct edition (webview login window + page-context fetch relay, see
# do_zhihu_fetch) is deliberately *not* a named feature — it's expressed in
# lib.rs as #[cfg(not(feature = "appstore"))], so a bare `cargo build` /
# `cargo check` / `tauri build` (no flags at all) keeps compiling exactly
# what it always has. Only opting into "appstore" below changes anything —
# there is no `--no-default-features` juggling needed to keep the two
# mutually exclusive (the Tauri CLI's `-f/--features` flag can only add
# features, never remove the default one, so a real "direct" feature here
# would risk both editions' commands landing in the same appstore binary).
#
# No login window, no session relay at all in this edition — only Access
# Secret storage via the OS keychain, talking to Zhihu's official Data Open
# Platform instead. See docs/DEVELOPMENT.md for why this split exists.
appstore = ["dep:keyring"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time", "sync"] }
url = "2"
tauri-plugin-notification = "2"
keyring = { version = "3", optional = true }
