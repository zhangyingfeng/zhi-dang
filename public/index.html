<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知档</title><link rel="stylesheet" href="/style.css"></head><body><main><section class="panel"><div class="step" id="step-main"><div class="step-head"><h2 id="step-title">登录知乎导出</h2><button type="button" id="auth-btn">开始登录</button></div><p class="hint" id="auth-status">本应用不会保存或上传用户名和密码</p><label>保存位置<div class="dir-row"><input id="dir" value="exports" disabled><button type="button" class="secondary" id="browse" disabled>浏览…</button></div></label><p class="hint">只写入不存在或为空的目录，不会覆盖已有内容。</p><label class="check"><input id="images" type="checkbox" checked disabled> 下载正文图片</label><div class="actions"><button id="export" disabled>开始导出</button><button type="button" class="secondary" id="reveal" hidden>在访达中显示</button></div></div></section><section class="status" id="status-section" hidden><span id="dot" class="idle"></span><div><strong id="message">准备就绪</strong><progress id="bar" value="0" max="100"></progress><small id="count"></small></div></section><footer>所有内容和登录会话仅保存在这台电脑，不会上传到任何地方。</footer></main><div id="toast" class="toast" hidden></div><script src="/app.js"></script></body></html>
