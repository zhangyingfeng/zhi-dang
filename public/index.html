<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知乎作者归档工具</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="mark">归</div><div><h1>知乎作者归档工具</h1><p>把属于你的回答与文章，完整保存到本地。</p></div></header><section class="panel"><div class="step"><b>1</b><div><h2>登录知乎</h2><p>应用会打开独立的 Chrome 窗口。请在那里登录，密码不会交给本应用。</p><button id="login">打开登录窗口</button><button class="secondary" id="check">我已登录</button></div></div><div class="step"><b>2</b><div><h2>导出设置</h2><label>新的空目录<input id="dir" value="exports"></label><label class="check"><input id="images" type="checkbox" checked> 下载正文图片</label><button id="export">开始完整导出</button><p>为避免覆盖数据，工具只写入不存在或为空的目录。</p></div></div></section><section class="status"><span id="dot"></span><div><strong id="message">准备就绪</strong><progress id="bar" value="0" max="100"></progress><small id="count"></small></div></section><footer>所有内容和登录会话仅保存在这台电脑。可删除 <code>.data/browser-profile</code> 清除会话。</footer></main><script src="/app.js"></script></body></html>
