<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知档</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="mark">档</div><div><h1>知档</h1><p>把属于你的知乎回答与文章，完整保存到本地。</p></div></header><section class="panel"><div class="step no-number" id="step-login"><div><h2>登录知乎</h2><p>将在独立窗口完成登录，密码不会经过本应用。</p><button id="login">开始登录</button></div></div><div class="step no-number" id="step-export" style="display:none"><div><h2>导出设置</h2><label>保存位置<div class="dir-row"><input id="dir" value="exports"><button type="button" class="secondary" id="browse">浏览…</button></div></label><p class="hint">只写入不存在或为空的目录，不会覆盖已有内容。</p><label class="check"><input id="images" type="checkbox" checked> 下载正文图片</label><button id="export">开始导出</button><button type="button" class="secondary" id="reveal" hidden>在访达中显示</button></div></div></section><section class="status" id="status-section" hidden><span id="dot" class="idle"></span><div><strong id="message">准备就绪</strong><progress id="bar" value="0" max="100"></progress><small id="count"></small></div></section><footer>所有内容和登录会话仅保存在这台电脑，不会上传到任何地方。</footer></main><div id="toast" class="toast" hidden></div><script src="/app.js"></script></body></html>
