<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知档</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div class="mark">档</div><div><h1>知档</h1><p>把属于你的知乎回答与文章，完整保存到本地。</p></div></header><section class="panel"><div class="step" id="step-login"><b>1</b><div><h2>登录知乎</h2><p>点击按钮会弹出登录窗口，在其中完成知乎登录；登录成功后该窗口会提示可以关闭。密码不会交给本应用。</p><button id="login">登录知乎</button></div></div><div class="step" id="step-export" style="display:none"><b>2</b><div><h2>导出设置</h2><label>新的空目录<div class="dir-row"><input id="dir" value="exports"><button type="button" class="secondary" id="browse">浏览…</button></div></label><label class="check"><input id="images" type="checkbox" checked> 下载正文图片</label><button id="export">开始完整导出</button><button type="button" class="secondary" id="reveal" hidden>在访达中显示</button><p>为避免覆盖数据，工具只写入不存在或为空的目录。</p></div></div></section><section class="status"><span id="dot"></span><div><strong id="message">准备就绪</strong><progress id="bar" value="0" max="100"></progress><small id="count"></small></div></section><footer>所有内容和登录会话仅保存在这台电脑，不会上传到任何地方。</footer></main><div id="toast" class="toast" hidden></div><script src="/app.js"></script></body></html>
