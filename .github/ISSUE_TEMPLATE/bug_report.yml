name: Bug report
description: Report a reproducible problem without sharing private data
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Check docs/TROUBLESHOOTING.md first. Do not attach cookies, tokens, browser profiles, real exported content or screenshots containing personal data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node.js 24, Chrome version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic examples and redact account information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account identifiers, personal data and copyrighted content from this report.
          required: true
